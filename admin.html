<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | BULIS</title>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="sql-wasm.js"></script>
    <script src="db.js"></script>
    <style>
        :root { --main: #000; --bg: #f8f9fa; --border: #eee; --accent: #2ecc71; }
        body { font-family: 'Roboto', sans-serif; background: var(--bg); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 260px; background: #000; color: #fff; padding: 30px 0; display: flex; flex-direction: column; }
        .sidebar-header { padding: 0 30px 40px; }
        .logo { font-family: 'Teko', sans-serif; font-size: 2.5rem; letter-spacing: 2px; }
        .nav-items { flex: 1; }
        .nav-item { padding: 15px 30px; cursor: pointer; border-left: 4px solid transparent; transition: 0.3s; font-size: 0.9rem; letter-spacing: 1px; text-transform: uppercase; }
        .nav-item:hover { background: #111; }
        .nav-item.active { background: #111; border-color: var(--accent); }
        .logout { padding: 20px 30px; color: #e74c3c; cursor: pointer; font-weight: 700; border-top: 1px solid #222; margin-top: auto; }

        /* Main Content */
        .main { flex: 1; overflow-y: auto; padding: 40px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h1 { font-family: 'Teko', sans-serif; font-size: 2.5rem; margin: 0; text-transform: uppercase; }
        .btn { padding: 12px 25px; border-radius: 4px; border: none; font-weight: 700; cursor: pointer; text-transform: uppercase; font-size: 0.8rem; }
        .btn-main { background: #000; color: #fff; }
        .btn-accent { background: var(--accent); color: #fff; }

        /* Table Styles */
        .data-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .data-table th { background: #fdfdfd; padding: 15px 20px; text-align: left; font-size: 0.8rem; color: #888; text-transform: uppercase; border-bottom: 1px solid var(--border); }
        .data-table td { padding: 15px 20px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        .product-img-small { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
        .actions { display: flex; gap: 10px; }
        .btn-action { padding: 5px 10px; border-radius: 4px; border: 1px solid #ddd; background: #fff; cursor: pointer; font-size: 0.75rem; }
        .btn-delete { color: #e74c3c; border-color: #f5c6cb; }

        /* Modal Form */
        .form-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .form-overlay.show { display: flex; }
        .form-card { background: #fff; width: 100%; max-width: 600px; padding: 40px; border-radius: 8px; max-height: 90vh; overflow-y: auto; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group.full { grid-column: span 2; }
        label { display: block; font-size: 0.75rem; font-weight: 700; margin-bottom: 8px; color: #666; text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="logo">BULIS ADMIN</div>
        </div>
        <div class="nav-items">
            <div class="nav-item active" onclick="switchTab('products')">Productos</div>
            <div class="nav-item" onclick="switchTab('categories')">Categorías</div>
            <div class="nav-item" onclick="switchTab('config')">Ajustes Web</div>
        </div>
        <div class="logout" onclick="logout()">Cerrar Sesión</div>
    </div>

    <div class="main">
        <!-- Tab Productos -->
        <div id="tab-products" class="tab-content active">
            <div class="header-row">
                <h1>Gestión de Productos</h1>
                <button class="btn btn-main" onclick="openAddModal()">+ Nuevo Producto</button>
            </div>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Cód</th>
                        <th>Imagen</th>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Oferta</th>
                        <th>Categoría</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="products-tbody"></tbody>
            </table>
        </div>

        <!-- Tab Categorías -->
        <div id="tab-categories" class="tab-content">
            <div class="header-row">
                <h1>Gestión de Categorías</h1>
                <button class="btn btn-main" onclick="openCatModal()">+ Nueva Categoría</button>
            </div>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Imagen</th>
                        <th>Nombre</th>
                        <th>Enlace</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="categories-tbody"></tbody>
            </table>
        </div>

        <!-- Tab Config -->
        <div id="tab-config" class="tab-content">
            <div class="header-row">
                <h1>Ajustes de la Tienda</h1>
            </div>
            <div style="background:#fff; padding:30px; border-radius:8px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group">
                    <label>Nombre de la Tienda</label>
                    <input type="text" id="cfg-name">
                </div>
                <div class="form-group">
                    <label>Color Principal (Tema)</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="color" id="cfg-color-picker" style="width: 50px; padding: 2px; height: 42px;">
                        <input type="text" id="cfg-color" placeholder="#000000">
                    </div>
                </div>
                <div class="form-group">
                    <label>WhatsApp (Solo Números)</label>
                    <input type="text" id="cfg-whatsapp">
                </div>
                <div class="form-group">
                    <label>URL del Logo</label>
                    <input type="text" id="cfg-logo">
                </div>
                <div class="form-group">
                    <label>Subtítulo del Banner (Hero)</label>
                    <input type="text" id="cfg-banner-sub">
                </div>
                <div class="form-group">
                    <label>Título del Banner (Hero)</label>
                    <input type="text" id="cfg-banner-title">
                </div>
                <div class="form-group full">
                    <label>Dirección Física</label>
                    <input type="text" id="cfg-address">
                </div>
                <div class="form-group full">
                    <label>Enlace Google Maps</label>
                    <input type="text" id="cfg-maps">
                </div>
                <div class="form-group full">
                    <label>Mensajes de Marquesina (Separados por punto y coma ';')</label>
                    <textarea id="cfg-marquee" rows="4"></textarea>
                </div>
                <div class="form-group full" style="margin-top: 20px;">
                    <button class="btn btn-accent" onclick="saveAllConfigs()" style="width: 100%;">GUARDAR TODOS LOS CAMBIOS</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Modal Form Producto -->
    <div class="form-overlay" id="form-overlay">
        <div class="form-card">
            <h2 id="modal-title" style="font-family:'Teko', sans-serif; font-size:2rem; margin-top:0;">NUEVO PRODUCTO</h2>
            <form id="product-form">
                <input type="hidden" id="p-id">
                <div class="form-grid">
                    <div class="form-group full">
                        <label>Nombre del Producto</label>
                        <input type="text" id="p-name" required>
                    </div>
                    <div class="form-group">
                        <label>Categoría</label>
                        <select id="p-category">
                            <option value="ropa">Ropa</option>
                            <option value="perfumes">Perfumes</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Sub-Categoría</label>
                        <input type="text" id="p-sub" placeholder="polos, hombre, etc.">
                    </div>
                    <div class="form-group">
                        <label>Precio Actual (S/)</label>
                        <input type="number" id="p-price" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>Precio Anterior (S/)</label>
                        <input type="number" id="p-prev" step="0.01">
                    </div>
                    <div class="form-group">
                        <label>Tallas (Separadas por comas)</label>
                        <input type="text" id="p-sizes" placeholder="S, M, L, XL">
                    </div>
                    <div class="form-group">
                        <label>Colores (Separados por comas)</label>
                        <input type="text" id="p-colors" placeholder="Blanco, Negro, Gris">
                    </div>
                    <div class="form-group full">
                        <label>Descripción</label>
                        <textarea id="p-desc" rows="3"></textarea>
                    </div>
                    <div class="form-group full">
                        <label>URL de Imagen</label>
                        <input type="text" id="p-img" placeholder="img/productos/..." required>
                    </div>
                </div>
                <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:30px;">
                    <button type="button" class="btn" style="background:#eee;" onclick="closeForm()">Cancelar</button>
                    <button type="submit" class="btn btn-main">Guardar Producto</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Form Categoría -->
    <div class="form-overlay" id="cat-modal-overlay">
        <div class="form-card">
            <h2 style="font-family:'Teko', sans-serif; font-size:2rem; margin-top:0;">NUEVA CATEGORÍA</h2>
            <form id="cat-form">
                <div class="form-group">
                    <label>Nombre de la Categoría</label>
                    <input type="text" id="cat-name" placeholder="Ej: Ropa Urban" required>
                </div>
                <div class="form-group">
                    <label>Enlace de Destino</label>
                    <input type="text" id="cat-link" placeholder="ropa.html o #id" required>
                </div>
                <div class="form-group">
                    <label>URL de Imagen</label>
                    <input type="text" id="cat-img" placeholder="img/categorias/..." required>
                </div>
                <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:30px;">
                    <button type="button" class="btn" style="background:#eee;" onclick="closeCatModal()">Cancelar</button>
                    <button type="submit" class="btn btn-main">Guardar Categoría</button>
                </div>
            </form>
        </div>
    </div>



    <script>
        // Check Auth
        if (!sessionStorage.getItem('bulis_admin')) {
            window.location.href = 'admin-login.html';
        }

        async function initAdmin() {
            await initDB();
            loadProducts();
            loadConfig();
        }

        function loadProducts() {
            const products = window.dbActions.getProducts();
            const tbody = document.getElementById('products-tbody');
            tbody.innerHTML = '';
            
            products.forEach(p => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>#${p.id}</td>
                    <td><img src="${p.image}" class="product-img-small"></td>
                    <td><b>${p.name}</b></td>
                    <td>S/ ${p.price.toFixed(2)}</td>
                    <td>${p.discount || '-'}</td>
                    <td style="text-transform:uppercase; font-size:0.75rem;">${p.category}</td>
                    <td>
                        <div class="actions">
                            <button class="btn-action" onclick="deleteProduct(${p.id})">❌</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function deleteProduct(id) {
            if (confirm('¿Estas seguro de eliminar este producto?')) {
                window.dbActions.deleteProduct(id);
                loadProducts();
            }
        }

        function loadCategories() {
            const cats = window.dbActions.getCategories();
            const tbody = document.getElementById('categories-tbody');
            tbody.innerHTML = '';
            cats.forEach(c => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>#${c.id}</td>
                    <td><img src="${c.image || 'img/placeholder.png'}" class="product-img-small"></td>
                    <td><b>${c.name}</b></td>
                    <td><code>${c.link}</code></td>
                    <td>
                        <button class="btn-action btn-delete" onclick="deleteCategory(${c.id})">❌</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function deleteCategory(id) {
            if (confirm('¿Eliminar esta categoría?')) {
                window.dbActions.deleteCategory(id);
                loadCategories();
            }
        }

        const catModal = document.getElementById('cat-modal-overlay');
        function openCatModal() {
            document.getElementById('cat-form').reset();
            catModal.classList.add('show');
        }

        function closeCatModal() {
            catModal.classList.remove('show');
        }

        document.getElementById('cat-form').onsubmit = (e) => {
            e.preventDefault();
            const name = document.getElementById('cat-name').value;
            const link = document.getElementById('cat-link').value;
            const img = document.getElementById('cat-img').value;
            
            window.dbActions.addCategory(name, link, img);
            closeCatModal();
            loadCategories();
        };

        function loadConfig() {
            const wa = window.dbActions.getConfig('whatsapp') || '51933489344';
            const name = window.dbActions.getConfig('store_name') || 'BULIS';
            const logo = window.dbActions.getConfig('store_logo') || 'img/logobuli.png';
            const addr = window.dbActions.getConfig('store_address') || '';
            const maps = window.dbActions.getConfig('store_maps_link') || '';
            const marq = window.dbActions.getConfig('marquee_items') || '';
            const color = window.dbActions.getConfig('primary_color') || '#000000';
            const bSub = window.dbActions.getConfig('banner_subtitle') || '';
            const bTitle = window.dbActions.getConfig('banner_title') || '';

            document.getElementById('cfg-whatsapp').value = wa;
            document.getElementById('cfg-name').value = name;
            document.getElementById('cfg-logo').value = logo;
            document.getElementById('cfg-address').value = addr;
            document.getElementById('cfg-maps').value = maps;
            document.getElementById('cfg-marquee').value = marq;
            document.getElementById('cfg-color').value = color;
            document.getElementById('cfg-color-picker').value = color;
            document.getElementById('cfg-banner-sub').value = bSub;
            document.getElementById('cfg-banner-title').value = bTitle;
            
            // Sync color picker with text input
            document.getElementById('cfg-color-picker').oninput = (e) => {
                document.getElementById('cfg-color').value = e.target.value;
            };
        }

        function saveAllConfigs() {
            window.dbActions.updateConfig('whatsapp', document.getElementById('cfg-whatsapp').value);
            window.dbActions.updateConfig('store_name', document.getElementById('cfg-name').value);
            window.dbActions.updateConfig('store_logo', document.getElementById('cfg-logo').value);
            window.dbActions.updateConfig('store_address', document.getElementById('cfg-address').value);
            window.dbActions.updateConfig('store_maps_link', document.getElementById('cfg-maps').value);
            window.dbActions.updateConfig('marquee_items', document.getElementById('cfg-marquee').value);
            window.dbActions.updateConfig('primary_color', document.getElementById('cfg-color').value);
            window.dbActions.updateConfig('banner_subtitle', document.getElementById('cfg-banner-sub').value);
            window.dbActions.updateConfig('banner_title', document.getElementById('cfg-banner-title').value);
            
            alert('¡Configuración de tienda actualizada con éxito!');
        }



        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            event.target.classList.add('active');
        }

        const formOverlay = document.getElementById('form-overlay');
        function openAddModal() {
            document.getElementById('product-form').reset();
            document.getElementById('p-id').value = '';
            document.getElementById('modal-title').innerText = 'NUEVO PRODUCTO';
            formOverlay.classList.add('show');
        }

        function closeForm() {
            formOverlay.classList.remove('show');
        }

        document.getElementById('product-form').onsubmit = (e) => {
            e.preventDefault();
            const p = {
                name: document.getElementById('p-name').value,
                category: document.getElementById('p-category').value,
                sub: document.getElementById('p-sub').value,
                price: parseFloat(document.getElementById('p-price').value),
                prevPrice: parseFloat(document.getElementById('p-prev').value) || 0,
                discount: null, // Podria calcularse auto
                sizes: document.getElementById('p-sizes').value,
                colors: document.getElementById('p-colors').value,
                desc: document.getElementById('p-desc').value,
                image: document.getElementById('p-img').value
            };
            
            // Calculo de descuento auto si hay precio anterior
            if (p.prevPrice > p.price) {
                const d = Math.round(((p.prevPrice - p.price) / p.prevPrice) * 100);
                p.discount = `-${d}%`;
            }

            window.dbActions.addProduct(p);
            closeForm();
            loadProducts();
        };

        function logout() {
            sessionStorage.removeItem('bulis_admin');
            window.location.href = 'index.html';
        }

        initAdmin();
    </script>
</body>
</html>

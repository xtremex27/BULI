<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="db.js"></script>
    <script>
        // Bloqueo de acceso instantáneo
        if (sessionStorage.getItem('bulis_admin') !== 'true') {
            window.location.href = 'admin-login.html';
        }
    </script>
    <style>
        :root { --main: #000; --bg: #f8f9fa; --border: #eee; --accent: #2ecc71; }
        body { display: none; font-family: 'Roboto', sans-serif; background: var(--bg); margin: 0; height: 100vh; overflow: hidden; }
        body.authenticated { display: flex; }
        
        /* Sidebar */
        .sidebar { width: 260px; background: #000; color: #fff; padding: 30px 0; display: flex; flex-direction: column; }
        .sidebar-header { padding: 0 30px 40px; }
        .logo { font-family: 'Teko', sans-serif; font-size: 2.5rem; letter-spacing: 2px; }
        .nav-items { flex: 1; }
        .nav-item { padding: 15px 30px; cursor: pointer; border-left: 4px solid transparent; transition: 0.3s; font-size: 0.9rem; letter-spacing: 1px; text-transform: uppercase; }
        .nav-item:hover { background: #111; }
        .nav-item.active { background: #111; border-color: var(--accent); }
        .logout { padding: 20px 30px; color: #e74c3c; cursor: pointer; font-weight: 700; border-top: 1px solid #222; margin-top: auto; }

        /* Main Content */
        .main { flex: 1; overflow-y: auto; padding: 40px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h1 { font-family: 'Teko', sans-serif; font-size: 2.5rem; margin: 0; text-transform: uppercase; }
        .btn { padding: 12px 25px; border-radius: 4px; border: none; font-weight: 700; cursor: pointer; text-transform: uppercase; font-size: 0.8rem; }
        .btn-main { background: #000; color: #fff; }
        .btn-accent { background: var(--accent); color: #fff; }

        /* Table Styles */
        .data-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .data-table th { background: #fdfdfd; padding: 15px 20px; text-align: left; font-size: 0.8rem; color: #888; text-transform: uppercase; border-bottom: 1px solid var(--border); }
        .data-table td { padding: 15px 20px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        .product-img-small { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
        .actions { display: flex; gap: 10px; }
        .btn-action { padding: 5px 10px; border-radius: 4px; border: 1px solid #ddd; background: #fff; cursor: pointer; font-size: 0.75rem; }
        .btn-delete { color: #e74c3c; border-color: #f5c6cb; }

        /* Modal Form */
        .form-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .form-overlay.show { display: flex; }
        .form-card { background: #fff; width: 100%; max-width: 600px; padding: 40px; border-radius: 8px; max-height: 90vh; overflow-y: auto; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group.full { grid-column: span 2; }
        label { display: block; font-size: 0.75rem; font-weight: 700; margin-bottom: 8px; color: #666; text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 0.9rem; }

        /* Preview Style */
        .image-upload-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 0; gap: 15px; }
        .preview-container { width: 150px; height: 150px; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.1); overflow: hidden; cursor: pointer; position: relative; background: #eee; transition: 0.3s; }
        .preview-container:hover { transform: scale(1.05); border-color: var(--accent); }
        .preview-container img { width: 100%; height: 100%; object-fit: cover; }
        .preview-placeholder { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #aaa; }
        .upload-label { font-size: 0.8rem; color: var(--accent); font-weight: 700; cursor: pointer; text-transform: uppercase; }
        #p-file, #cat-file { display: none; }

        /* Responsividad Admin */
        .table-wrapper { width: 100%; overflow-x: auto; background: #fff; border-radius: 8px; margin-bottom: 20px; }
        
        @media (max-width: 768px) {
            body { flex-direction: column; overflow-y: auto; height: auto; }
            .sidebar { width: 100%; padding: 15px 0; height: auto; position: sticky; top: 0; z-index: 999; }
            .sidebar-header { padding: 0 20px 10px; }
            .logo { font-size: 1.8rem; text-align: center; }
            .nav-items { display: flex; justify-content: center; overflow-x: auto; }
            .nav-item { padding: 10px 15px; font-size: 0.8rem; white-space: nowrap; border-left: none; border-bottom: 3px solid transparent; }
            .nav-item.active { border-bottom-color: var(--accent); }
            .logout { padding: 10px 20px; text-align: center; border-top: none; }
            .main { padding: 20px; }
            .header-row { flex-direction: column; gap: 15px; align-items: flex-start; }
            .btn { width: 100%; }
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full { grid-column: span 1; }
            .form-card { padding: 20px; width: 95%; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="logo"><span class="store-name"></span> ADMIN</div>
        </div>
        <div class="nav-items">
            <div class="nav-item active" onclick="switchTab('products')">Productos</div>
            <div class="nav-item" onclick="switchTab('categories')">Categorías</div>
            <div class="nav-item" onclick="switchTab('config')">Ajustes Web</div>
        </div>
        <div class="logout" onclick="logout()">Cerrar Sesión</div>
    </div>

    <div class="main">
        <!-- Tab Productos -->
        <div id="tab-products" class="tab-content active">
            <div class="header-row">
                <h1>Gestión de Productos</h1>
                <button class="btn btn-main" onclick="openAddModal()">+ Nuevo Producto</button>
            </div>
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Cód</th>
                            <th>Imagen</th>
                            <th>Nombre</th>
                            <th>Precio</th>
                            <th>Oferta</th>
                            <th>Categoría</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="products-tbody"></tbody>
                </table>
            </div>
        </div>

        <!-- Tab Categorías -->
        <div id="tab-categories" class="tab-content">
            <div class="header-row">
                <h1>Gestión de Categorías</h1>
                <button class="btn btn-main" onclick="openCatModal()">+ Nueva Categoría</button>
            </div>
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Imagen</th>
                            <th>Nombre</th>
                            <th>Enlace</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="categories-tbody"></tbody>
                </table>
            </div>
        </div>

        <!-- Tab Config -->
        <div id="tab-config" class="tab-content">
            <div class="header-row">
                <h1>Ajustes de la Tienda</h1>
            </div>
            <div style="background:#fff; padding:20px; border-radius:8px; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;">
                <div class="form-group">
                    <label>Nombre de la Tienda</label>
                    <input type="text" id="cfg-name">
                </div>
                <div class="form-group">
                    <label>Color Principal (Tema)</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="color" id="cfg-color-picker" style="width: 50px; padding: 2px; height: 42px;">
                        <input type="text" id="cfg-color" placeholder="#000000">
                    </div>
                </div>
                <div class="form-group">
                    <label>WhatsApp (Solo Números)</label>
                    <input type="text" id="cfg-whatsapp">
                </div>
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="cfg-email" placeholder="ventas@bulis.pe">
                </div>
                <div class="form-group">
                    <label>Link de Instagram</label>
                    <input type="text" id="cfg-ig" placeholder="https://instagram.com/bulis">
                </div>
                <div class="form-group full" style="grid-column: 1 / -1;">
                    <label style="text-align: center;">Logotipo de la Tienda</label>
                    <div class="image-upload-wrapper">
                        <div class="preview-container" onclick="document.getElementById('cfg-file').click()">
                            <div class="preview-placeholder" id="cfg-logo-placeholder">📷</div>
                            <img id="cfg-logo-preview" style="display: none;">
                        </div>
                        <label for="cfg-file" class="upload-label">Toca para cambiar logo</label>
                        <input type="file" id="cfg-file" accept="image/*">
                        <input type="hidden" id="cfg-logo">
                    </div>
                </div>
                <div class="form-group">
                    <label>Subtítulo del Banner (Hero)</label>
                    <input type="text" id="cfg-banner-sub">
                </div>
                <div class="form-group">
                    <label>Título del Banner (Hero)</label>
                    <input type="text" id="cfg-banner-title">
                </div>
                <div class="form-group full" style="grid-column: 1 / -1;">
                    <label>Dirección Física</label>
                    <input type="text" id="cfg-address">
                </div>
                <div class="form-group full" style="grid-column: 1 / -1;">
                    <label>Enlace Google Maps</label>
                    <input type="text" id="cfg-maps">
                </div>
                <div class="form-group full" style="grid-column: 1 / -1;">
                    <label>Mensajes de Marquesina (Separados por punto y coma ';')</label>
                    <textarea id="cfg-marquee" rows="4"></textarea>
                </div>
                <div class="form-group full" style="grid-column: 1 / -1; margin-top: 20px;">
                    <button class="btn btn-accent" onclick="saveAllConfigs()" style="width: 100%;">GUARDAR TODOS LOS CAMBIOS</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Modal Form Producto -->
    <div class="form-overlay" id="form-overlay">
        <div class="form-card">
            <h2 id="modal-title" style="font-family:'Teko', sans-serif; font-size:2rem; margin-top:0;">NUEVO PRODUCTO</h2>
            <form id="product-form">
                <input type="hidden" id="p-id">
                <div class="form-grid">
                    <div class="form-group full">
                        <label>Nombre del Producto</label>
                        <input type="text" id="p-name" required>
                    </div>
                    <div class="form-group">
                        <label>Categoría</label>
                        <select id="p-category" onchange="updateSubCategorySelect()" required>
                            <option value="">Seleccione...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Sub-Categoría</label>
                        <select id="p-sub" required>
                            <option value="">Primero elija categoría...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Precio Actual (S/)</label>
                        <input type="number" id="p-price" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>Precio Anterior (S/)</label>
                        <input type="number" id="p-prev" step="0.01">
                    </div>
                    <div class="form-group">
                        <label>Tallas (Separadas por comas)</label>
                        <input type="text" id="p-sizes" placeholder="S, M, L, XL">
                    </div>
                    <div class="form-group">
                        <label>Colores (Separados por comas)</label>
                        <input type="text" id="p-colors" placeholder="Blanco, Negro, Gris">
                    </div>
                    <div class="form-group full">
                        <label>Descripción</label>
                        <textarea id="p-desc" rows="3"></textarea>
                    </div>
                    <div class="form-group full">
                        <label style="text-align: center;">Imagen del Producto</label>
                        <div class="image-upload-wrapper">
                            <div class="preview-container" onclick="document.getElementById('p-file').click()">
                                <div class="preview-placeholder" id="p-placeholder">📷</div>
                                <img id="p-preview" style="display: none;">
                            </div>
                            <label for="p-file" class="upload-label">Toca para cambiar imagen</label>
                            <input type="file" id="p-file" accept="image/*">
                            <input type="hidden" id="p-img">
                        </div>
                    </div>
                </div>
                <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:30px;">
                    <button type="button" class="btn" style="background:#eee;" onclick="closeForm()">Cancelar</button>
                    <button type="submit" class="btn btn-main">Guardar Producto</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Form Categoría -->
    <div class="form-overlay" id="cat-modal-overlay">
        <div class="form-card">
            <h2 style="font-family:'Teko', sans-serif; font-size:2rem; margin-top:0;">NUEVA CATEGORÍA</h2>
            <form id="cat-form">
                <input type="hidden" id="cat-id-val">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nombre de la Categoría</label>
                        <input type="text" id="cat-name" placeholder="Ej: Ropa Urban" required>
                    </div>
                    <div class="form-group">
                        <label>Subtítulo</label>
                        <input type="text" id="cat-subtitle" placeholder="Ej: Recién llegado">
                    </div>
                    <div class="form-group full">
                        <label>Descripción del Banner</label>
                        <textarea id="cat-desc" rows="2" placeholder="Ej: Prendas en tendencia a precios mayoristas..."></textarea>
                    </div>
                    <div class="form-group full">
                        <label>Enlace de Destino</label>
                        <input type="text" id="cat-link" placeholder="ropa.html o #id" required>
                    </div>
                    <div class="form-group full">
                        <label style="text-align: center;">Imagen de la Categoría</label>
                        <div class="image-upload-wrapper">
                            <div class="preview-container" onclick="document.getElementById('cat-file').click()">
                                <div class="preview-placeholder" id="cat-placeholder">📷</div>
                                <img id="cat-preview" style="display: none;">
                            </div>
                            <label for="cat-file" class="upload-label">Toca para cambiar imagen</label>
                            <input type="file" id="cat-file" accept="image/*">
                            <input type="hidden" id="cat-img">
                        </div>
                    </div>
                </div>
                <!-- Sección de Sub-categorías -->
                <div id="sub-cat-section" style="display:none; margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px;">
                    <label>Sub-categorías (Texto)</label>
                    <div style="display:flex; gap:10px; margin-bottom: 10px;">
                        <input type="text" id="new-sub-name" placeholder="Nueva sub-categoría...">
                        <button type="button" class="btn btn-main" onclick="addSubCategory()" style="width:auto; padding: 10px 20px;">+</button>
                    </div>
                    <div id="sub-cat-list" style="display:flex; flex-wrap:wrap; gap:10px;"></div>
                </div>

                <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:30px;">
                    <button type="button" class="btn" style="background:#eee;" onclick="closeCatModal()">Cancelar</button>
                    <button type="submit" class="btn btn-main">Guardar Categoría</button>
                </div>
            </form>
           <script>
        // Mostrar contenido si está autenticado
        document.body.classList.add('authenticated');

        // Previsualización de Imágenes
        function setupPreview(fileInputId, imgId, placeholderId) {
            const input = document.getElementById(fileInputId);
            const img = document.getElementById(imgId);
            const placeholder = document.getElementById(placeholderId);

            input.onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        img.src = event.target.result;
                        img.style.display = 'block';
                        placeholder.style.display = 'none';
                    };
                    reader.readAsDataURL(file);
                }
            };
        }

        async function initAdmin() {
            // Asegurar que dbActions esté disponible
            if (!window.dbActions || typeof window.dbActions.getProducts !== 'function') {
                setTimeout(initAdmin, 500);
                return;
            }
            
            // Iniciar carga de datos
            await loadProducts();
            await loadCategories();
            await loadConfig();

            // Setup previews
            setupPreview('p-file', 'p-preview', 'p-placeholder');
            setupPreview('cat-file', 'cat-preview', 'cat-placeholder');
            setupPreview('cfg-file', 'cfg-logo-preview', 'cfg-logo-placeholder');
        }

        async function loadProducts() {
            const products = await window.dbActions.getProducts();
            const tbody = document.getElementById('products-tbody');
            tbody.innerHTML = '';
            
            products.forEach(p => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>#${p.id}</td>
                    <td><img src="${p.image}" class="product-img-small" onerror="this.src='https://via.placeholder.com/50/eee/000'"></td>
                    <td><b>${p.name}</b></td>
                    <td>S/ ${parseFloat(p.price).toFixed(2)}</td>
                    <td>${p.discount || '-'}</td>
                    <td style="text-transform:uppercase; font-size:0.75rem;">${p.category}</td>
                    <td>
                        <div class="actions">
                            <button class="btn-action" onclick="deleteProduct(${p.id})">❌</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function deleteProduct(id) {
            if (confirm('¿Estas seguro de eliminar este producto?')) {
                await window.dbActions.deleteProduct(id);
                await loadProducts();
            }
        }

        async function loadCategories() {
            const cats = await window.dbActions.getCategories();
            const tbody = document.getElementById('categories-tbody');
            tbody.innerHTML = '';
            
            // También actualizar select de productos
            const pCatSelect = document.getElementById('p-category');
            pCatSelect.innerHTML = '<option value="">Seleccione...</option>';

            cats.forEach(c => {
                // Fila de tabla
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>#${c.id}</td>
                    <td><img src="${c.image || 'https://via.placeholder.com/50/eee/000'}" class="product-img-small"></td>
                    <td><b>${c.name}</b></td>
                    <td><code>${c.link}</code></td>
                    <td>
                        <div class="actions" style="gap:5px;">
                            <button class="btn-action" onclick="openCatModal(${JSON.stringify(c).replace(/"/g, '&quot;')})">✏️</button>
                            <button class="btn-action btn-delete" onclick="deleteCategory(${c.id})">❌</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);

                // Option en select de productos
                const opt = document.createElement('option');
                opt.value = c.name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); // slug
                opt.dataset.id = c.id;
                opt.textContent = c.name;
                pCatSelect.appendChild(opt);
            });
        }

        async function updateSubCategorySelect() {
            const pCatSelect = document.getElementById('p-category');
            const pSubSelect = document.getElementById('p-sub');
            const selectedOpt = pCatSelect.options[pCatSelect.selectedIndex];
            
            pSubSelect.innerHTML = '<option value="">Cargando...</option>';
            
            if (!selectedOpt || !selectedOpt.dataset.id) {
                pSubSelect.innerHTML = '<option value="">Primero elija categoría...</option>';
                return;
            }

            const subs = await window.dbActions.getSubCategories(selectedOpt.dataset.id);
            pSubSelect.innerHTML = '<option value="">Seleccione...</option>';
            subs.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.name.toLowerCase();
                opt.textContent = s.name;
                pSubSelect.appendChild(opt);
            });
        }

        async function deleteCategory(id) {
            if (confirm('¿Eliminar esta categoría?')) {
                await window.dbActions.deleteCategory(id);
                await loadCategories();
            }
        }

        const catModal = document.getElementById('cat-modal-overlay');
        function closeCatModal() {
            catModal.classList.remove('show');
        }

        async function openCatModal(cat = null) {
            const form = document.getElementById('cat-form');
            form.reset();
            
            if (cat) {
                document.getElementById('cat-id-val').value = cat.id;
                document.getElementById('cat-name').value = cat.name;
                document.getElementById('cat-subtitle').value = cat.subtitle || '';
                document.getElementById('cat-desc').value = cat.description || '';
                document.getElementById('cat-link').value = cat.link;
                document.getElementById('cat-img').value = cat.image || '';
                
                if (cat.image) {
                    document.getElementById('cat-preview').src = cat.image;
                    document.getElementById('cat-preview').style.display = 'block';
                    document.getElementById('cat-placeholder').style.display = 'none';
                }

                // Mostrar sub-categorías si ya existe la categoría
                document.getElementById('sub-cat-section').style.display = 'block';
                await loadSubCategoriesList(cat.id);
            } else {
                document.getElementById('cat-id-val').value = '';
                document.getElementById('sub-cat-section').style.display = 'none';
                document.getElementById('cat-preview').style.display = 'none';
                document.getElementById('cat-placeholder').style.display = 'flex';
            }
            
            catModal.classList.add('show');
        }

        async function loadSubCategoriesList(catId) {
            const list = document.getElementById('sub-cat-list');
            list.innerHTML = 'Cargando...';
            const subs = await window.dbActions.getSubCategories(catId);
            list.innerHTML = '';
            subs.forEach(s => {
                const chip = document.createElement('div');
                chip.style = "background:#f1f1f1; padding:5px 12px; border-radius:20px; font-size:0.8rem; display:flex; align-items:center; gap:8px;";
                chip.innerHTML = `${s.name} <span onclick="deleteSubCategory(${s.id}, ${catId})" style="cursor:pointer; color:red;">×</span>`;
                list.appendChild(chip);
            });
        }

        async function addSubCategory() {
            const name = document.getElementById('new-sub-name').value;
            const catId = document.getElementById('cat-id-val').value;
            if (!name || !catId) return;
            
            await window.dbActions.saveSubCategory({ category_id: catId, name });
            document.getElementById('new-sub-name').value = '';
            await loadSubCategoriesList(catId);
        }

        async function deleteSubCategory(id, catId) {
            if (confirm('¿Eliminar sub-categoría?')) {
                await window.dbActions.deleteSubCategory(id);
                await loadSubCategoriesList(catId);
            }
        }

        // Subida a Cloudinary
        async function uploadImage(file, button) {
            const oldText = button.innerText;
            button.innerText = 'SUBIENDO IMAGEN...';
            button.disabled = true;

            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', 'ml_default'); // Usuario debe configurar esto como 'Unsigned' en Cloudinary

            try {
                const res = await fetch(`https://api.cloudinary.com/v1_1/dxwkdkqln/image/upload`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                button.innerText = oldText;
                button.disabled = false;
                return data.secure_url;
            } catch (e) {
                console.error("Error upload:", e);
                alert("Error al subir a Cloudinary. Verifica tu conexión.");
                button.innerText = oldText;
                button.disabled = false;
                return null;
            }
        }

        document.getElementById('cat-form').onsubmit = async (e) => {
            e.preventDefault();
            const submitBtn = e.target.querySelector('button[type="submit"]');
            
            const fileInput = document.getElementById('cat-file');
            let imgUrl = document.getElementById('cat-img').value;

            if (fileInput.files.length > 0) {
                const uploaded = await uploadImage(fileInput.files[0], submitBtn);
                if (uploaded) imgUrl = uploaded;
            }

            const catId = document.getElementById('cat-id-val').value;
            const catData = {
                name: document.getElementById('cat-name').value,
                subtitle: document.getElementById('cat-subtitle').value,
                description: document.getElementById('cat-desc').value,
                link: document.getElementById('cat-link').value,
                image: imgUrl
            };
            
            // Solo enviar ID si realmente estamos editando (no vacío)
            if (catId && catId !== "") catData.id = parseInt(catId);

            await window.dbActions.saveCategory(catData);
            closeCatModal();
            await loadCategories();
        };

        async function loadConfig() {
            const wa = await window.dbActions.getConfig('whatsapp') || '51933489344';
            const name = await window.dbActions.getConfig('store_name') || 'BULIS';
            const logo = await window.dbActions.getConfig('store_logo') || 'img/logobuli.png';
            const addr = await window.dbActions.getConfig('store_address') || '';
            const maps = await window.dbActions.getConfig('store_maps_link') || '';
            const marq = await window.dbActions.getConfig('marquee_items') || '';
            const color = await window.dbActions.getConfig('primary_color') || '#000000';
            const bSub = await window.dbActions.getConfig('banner_subtitle') || '';
            const bTitle = await window.dbActions.getConfig('banner_title') || '';
            const email = await window.dbActions.getConfig('store_email') || '';
            const ig = await window.dbActions.getConfig('store_ig') || '';

            document.getElementById('cfg-whatsapp').value = wa;
            document.getElementById('cfg-name').value = name;
            document.getElementById('cfg-email').value = email;
            document.getElementById('cfg-ig').value = ig;
            document.getElementById('cfg-logo').value = logo;
            if (logo) {
                document.getElementById('cfg-logo-preview').src = logo;
                document.getElementById('cfg-logo-preview').style.display = 'block';
                document.getElementById('cfg-logo-placeholder').style.display = 'none';
            }
            document.getElementById('cfg-address').value = addr;
            document.getElementById('cfg-maps').value = maps;
            document.getElementById('cfg-marquee').value = marq;
            document.getElementById('cfg-color').value = color;
            document.getElementById('cfg-color-picker').value = color;
            document.getElementById('cfg-banner-sub').value = bSub;
            document.getElementById('cfg-banner-title').value = bTitle;
            
            document.getElementById('cfg-color-picker').oninput = (e) => {
                document.getElementById('cfg-color').value = e.target.value;
            };

            // Branding Dinámico en Admin
            document.title = `Admin | ${name}`;
            document.querySelectorAll('.store-name').forEach(el => el.innerText = name);
        }

        async function saveAllConfigs() {
            const btn = event.target;
            const oldText = btn.innerText;
            btn.innerText = 'GUARDANDO...';
            btn.disabled = true;

            let logoUrl = document.getElementById('cfg-logo').value;
            const logoFile = document.getElementById('cfg-file').files[0];
            if (logoFile) {
                const uploaded = await uploadImage(logoFile, btn);
                if (uploaded) logoUrl = uploaded;
            }

            await window.dbActions.updateConfig('whatsapp', document.getElementById('cfg-whatsapp').value);
            await window.dbActions.updateConfig('store_name', document.getElementById('cfg-name').value);
            await window.dbActions.updateConfig('store_logo', logoUrl);
            await window.dbActions.updateConfig('store_address', document.getElementById('cfg-address').value);
            await window.dbActions.updateConfig('store_maps_link', document.getElementById('cfg-maps').value);
            await window.dbActions.updateConfig('marquee_items', document.getElementById('cfg-marquee').value);
            await window.dbActions.updateConfig('primary_color', document.getElementById('cfg-color').value);
            await window.dbActions.updateConfig('banner_subtitle', document.getElementById('cfg-banner-sub').value);
            await window.dbActions.updateConfig('banner_title', document.getElementById('cfg-banner-title').value);
            await window.dbActions.updateConfig('store_email', document.getElementById('cfg-email').value);
            await window.dbActions.updateConfig('store_ig', document.getElementById('cfg-ig').value);
            
            btn.innerText = oldText;
            btn.disabled = false;
            alert('¡Configuración de tienda actualizada con éxito!');
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            // Nota: event.target puede ser nulo en llamadas automáticas
            if (event && event.target) event.target.classList.add('active');
        }

        const formOverlay = document.getElementById('form-overlay');
        function openAddModal() {
            document.getElementById('product-form').reset();
            document.getElementById('p-id').value = '';
            document.getElementById('modal-title').innerText = 'NUEVO PRODUCTO';
            
            // Reset preview
            document.getElementById('p-preview').style.display = 'none';
            document.getElementById('p-placeholder').style.display = 'flex';
            
            formOverlay.classList.add('show');
        }

        function closeForm() {
            formOverlay.classList.remove('show');
        }

        document.getElementById('product-form').onsubmit = async (e) => {
            e.preventDefault();
            const submitBtn = e.target.querySelector('button[type="submit"]');

            let imgUrl = document.getElementById('p-img').value;
            const fileInput = document.getElementById('p-file');

            if (fileInput.files.length > 0) {
                const uploaded = await uploadImage(fileInput.files[0], submitBtn);
                if (uploaded) imgUrl = uploaded;
            }

            const p = {
                name: document.getElementById('p-name').value,
                category: document.getElementById('p-category').value,
                sub: document.getElementById('p-sub').value,
                price: parseFloat(document.getElementById('p-price').value),
                prev_price: parseFloat(document.getElementById('p-prev').value) || 0,
                discount: null,
                sizes: document.getElementById('p-sizes').value,
                colors: document.getElementById('p-colors').value,
                desc: document.getElementById('p-desc').value,
                image: imgUrl
            };
            
            if (p.prev_price > p.price) {
                const d = Math.round(((p.prev_price - p.price) / p.prev_price) * 100);
                p.discount = `-${d}%`;
            }

            await window.dbActions.addProduct(p);
            closeForm();
            await loadProducts();
        };

        function logout() {
            sessionStorage.removeItem('bulis_admin');
            window.location.href = 'index.html';
        }

        initAdmin();
    </script>
</body>
</html>
